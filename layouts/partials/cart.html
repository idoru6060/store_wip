<div id="cart-overlay" class="cart-overlay"></div>
<aside id="cart-drawer" class="cart-drawer" aria-label="Shopping cart">
  <div class="cart-header">
    <h2>Your cart</h2>
    <button id="cart-close" class="cart-close" aria-label="Close cart">&times;</button>
  </div>
  <ul id="cart-items" class="cart-items"></ul>
  <p id="cart-empty" class="cart-empty">Your cart is empty.</p>
  <div class="cart-footer">
    <p class="cart-total">Total: <span id="cart-total">{{ site.Params.currency }}0.00</span></p>
    <button id="checkout-button" class="button button-primary" disabled>Checkout</button>
    <p id="checkout-error" class="checkout-error" hidden></p>
  </div>
</aside>
